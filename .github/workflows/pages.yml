
name: Publicar site no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar arquivos do repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        working-directory: pw/trabalhos/react
        run: npm ci

      - name: Executar testes automatizados
        working-directory: pw/trabalhos/react
        run: npm run test

      - name: Verificar código com ESLint
        working-directory: pw/trabalhos/react
        run: npm run lint

      - name: Gerar build de produção
        working-directory: pw/trabalhos/react
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './pw/trabalhos/react/dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
